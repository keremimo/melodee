name: Web emulator

# Builds Melodee in the browser (web/emu/build.sh) from next and publishes it to the Pages site's emu/.
on:
  push:
    branches: [next]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: melodee-nightly-pages   # gh-pages is shared with nightly.yml: one push at a time
  cancel-in-progress: false

jobs:
  emulator:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: next
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libharfbuzz-dev libfribidi-dev libraqm-dev
          python -m pip install Pillow fonttools
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
      - name: Build the emulator
        run: web/emu/build.sh
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .emu-pages
      - name: Publish to emu/
        run: |
          rm -rf .emu-pages/emu
          cp -r build/emu .emu-pages/emu
          cd .emu-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add emu
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish web emulator'
            git push origin HEAD:gh-pages
          fi
      - name: Request Pages publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
