name: Studio bundle

# The firmware's data for Melodee Studio (tools/studio_bundle.py -> build/studio-bundle): the tables, records and
# fixtures, protocol, constants, menu, scales, palettes, licences and, once the tree builds them, the WebAssembly core
# and kit encoder (Emscripten 3.1.74, as emulator.yml). Uploaded as the workflow artifact
# studio-bundle-<version>-<commit>, a tarball inside; Studio pins it by the tarball's sha256 (bundle.lock.json).
on:
  push:
    branches: [nightly]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      JIELI_TOOLCHAIN: ${{ github.workspace }}/.nightly-deps/jieli/toolchain
      AC79_SDK: ${{ github.workspace }}/.nightly-deps/sdk
      PARALLEL: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libharfbuzz-dev libfribidi-dev libraqm-dev
          python -m pip install -r tools/requirements-build.txt mido
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
      - uses: actions/cache@v4
        with:
          path: .nightly-deps
          key: jieli-linux-sdk-d179b448-v1
      - name: Fetch pinned SDK and toolchain
        run: |
          if [ ! -x "$JIELI_TOOLCHAIN/pi32v2/bin/clang" ]; then
            tools/get_toolchain.sh "$GITHUB_WORKSPACE/.nightly-deps/jieli"
          fi
          if [ ! -d "$AC79_SDK/.git" ]; then
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$AC79_SDK"
          fi
          test "$(git -C "$AC79_SDK" rev-parse HEAD)" = d179b4484759423312073f5fbb232501aa491047
      - name: Firmware build (the generated headers and the synths' module files the core links)
        run: ./build.sh
      - name: WebAssembly core and kit encoder (when the tree has their builds)
        run: |
          if [ -f web/core/build.sh ]; then PYTHON=python sh web/core/build.sh; fi
          if [ -f web/kit/build.sh ]; then PYTHON=python sh web/kit/build.sh; fi
      - name: Bundle
        run: python tools/studio_bundle.py
      - name: Verify against the manifest
        run: python tools/studio_bundle.py --verify build/studio-bundle
      - name: Package
        id: package
        run: |
          name=$(python -c 'import json; m = json.load(open("build/studio-bundle/manifest.json")); print("studio-bundle-%s-%s" % (m["firmware"]["version"], m["firmware"]["commit"][:12]))')
          tar -C build -cf - --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 studio-bundle | gzip -9n > "build/$name.tar.gz"
          (cd build && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          cat "build/$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            build/${{ steps.package.outputs.name }}.tar.gz
            build/${{ steps.package.outputs.name }}.tar.gz.sha256
